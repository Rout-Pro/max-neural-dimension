name: UI screenshot check

on:
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: bash gradlew :app:assembleDebug --no-daemon
      - name: Sign APK (persistent key)
        env:
          ND_KEYSTORE_BASE64: ${{ secrets.ND_KEYSTORE_BASE64 }}
          ND_KEYSTORE_PASSWORD: ${{ secrets.ND_KEYSTORE_PASSWORD }}
          ND_KEY_ALIAS: ${{ secrets.ND_KEY_ALIAS }}
          ND_KEY_PASSWORD: ${{ secrets.ND_KEY_PASSWORD }}
        run: |
          echo "$ND_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nd.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/nd.keystore" --ks-pass "pass:$ND_KEYSTORE_PASSWORD" --ks-key-alias "$ND_KEY_ALIAS" --key-pass "pass:$ND_KEY_PASSWORD" --out app/build/outputs/apk/debug/NeuralDimension.apk app/build/outputs/apk/debug/app-debug.apk
          rm -f "$RUNNER_TEMP/nd.keystore"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, install, drive UI, capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p shots
            adb install app/build/outputs/apk/debug/NeuralDimension.apk
            adb shell monkey -p com.max.neuraldimension -c android.intent.category.LAUNCHER 1
            sleep 14
            adb exec-out screencap -p > shots/01-home.png
            adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui.xml >/dev/null
            python3 - <<'PYEOF' > taps.sh
            import re
            x = open('ui.xml').read()
            for name in ['Chat','Voice','Tools','Settings']:
                m = re.search(r'text="%s"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"' % name, x)
                if m:
                    x1,y1,x2,y2 = map(int, m.groups())
                    print("TAP_%s='%d %d'" % (name.upper(), (x1+x2)//2, (y1+y2)//2))
                else:
                    print("echo 'MISSING %s' >&2" % name)
            PYEOF
            cat taps.sh
            source taps.sh
            if [ -n "$TAP_CHAT" ]; then adb shell input tap $TAP_CHAT; fi; sleep 3
            adb exec-out screencap -p > shots/02-chat.png
            if [ -n "$TAP_VOICE" ]; then adb shell input tap $TAP_VOICE; fi; sleep 3
            adb exec-out screencap -p > shots/03-voice.png
            if [ -n "$TAP_TOOLS" ]; then adb shell input tap $TAP_TOOLS; fi; sleep 3
            adb exec-out screencap -p > shots/04-tools.png
            if [ -n "$TAP_SETTINGS" ]; then adb shell input tap $TAP_SETTINGS; fi; sleep 3
            adb exec-out screencap -p > shots/05-settings.png
            # back to Chat, send a message, expect only the user bubble (honest starter: no fake AI reply)
            if [ -n "$TAP_CHAT" ]; then adb shell input tap $TAP_CHAT; fi; sleep 3
            adb shell uiautomator dump /sdcard/ui2.xml && adb pull /sdcard/ui2.xml ui2.xml >/dev/null
            python3 - <<'PYEOF' > taps2.sh
            import re
            x = open('ui2.xml').read()
            m = re.search(r'class="android.widget.EditText"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', x)
            if m:
                x1,y1,x2,y2 = map(int, m.groups())
                print("FIELD='%d %d'" % ((x1+x2)//2, (y1+y2)//2))
            m = re.search(r'content-desc="Send"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', x)
            if m:
                x1,y1,x2,y2 = map(int, m.groups())
                print("SEND='%d %d'" % ((x1+x2)//2, (y1+y2)//2))
            PYEOF
            cat taps2.sh
            source taps2.sh
            if [ -n "$FIELD" ]; then
              adb shell input tap $FIELD; sleep 1
              adb shell input text "hello"
              sleep 1
              adb shell input keyevent 111
              sleep 1
            fi
            if [ -n "$SEND" ]; then adb shell input tap $SEND; fi
            sleep 3
            adb exec-out screencap -p > shots/06-chat-sent.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: nd-ui-shots
          path: shots/
