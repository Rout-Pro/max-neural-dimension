name: UI screenshot check

on:
  workflow_dispatch:
    inputs:
      sections:
        description: 'Comma list: all,migration,core,regen,rename,edit,attachments,conv2,incognito,delete,errors,tail (smoke gate always runs)'
        required: false
        default: 'all'

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: bash gradlew :app:assembleDebug --no-daemon -PND_TEST_HOOK=true
      - name: Sign APK (persistent key)
        env:
          ND_KEYSTORE_BASE64: ${{ secrets.ND_KEYSTORE_BASE64 }}
          ND_KEYSTORE_PASSWORD: ${{ secrets.ND_KEYSTORE_PASSWORD }}
          ND_KEY_ALIAS: ${{ secrets.ND_KEY_ALIAS }}
          ND_KEY_PASSWORD: ${{ secrets.ND_KEY_PASSWORD }}
        run: |
          echo "$ND_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nd.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/nd.keystore" --ks-pass "pass:$ND_KEYSTORE_PASSWORD" --ks-key-alias "$ND_KEY_ALIAS" --key-pass "pass:$ND_KEY_PASSWORD" --out app/build/outputs/apk/debug/NeuralDimension-2.0.apk app/build/outputs/apk/debug/app-debug.apk
          rm -f "$RUNNER_TEMP/nd.keystore"
      - name: Download previous release APK (migration source)
        run: curl -sL -o /tmp/old.apk "https://github.com/${{ github.repository }}/releases/download/v2.0.0-test/NeuralDimension-2.0.apk" && ls -la /tmp/old.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start mock backend (no provider calls)
        run: nohup python3 tools/mock_backend.py > /tmp/mock_backend.log 2>&1 & sleep 1; curl -s http://127.0.0.1:8787/v1/health
      - name: Boot emulator, install, drive UI, capture screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Mock backend only: deterministic app-logic evidence with ZERO provider
          # calls (Gemini free quota is preserved; live-provider verification is a
          # separate, quota-gated batch). Replies are visibly prefixed "MOCK".
          ND_TEST_BACKEND_URL: http://10.0.2.2:8787
          ND_TEST_APP_TOKEN: ci-mock-token
          ND_SECTIONS: ${{ inputs.sections || 'all' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            mkdir -p shots
            adb install app/build/outputs/apk/debug/NeuralDimension-2.0.apk
            python3 tools/drive_ui.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nd-ui-shots
          path: shots/
