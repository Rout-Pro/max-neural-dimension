name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run JVM unit tests
        run: bash gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
      - name: Upload JVM-rendered screen pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-screen-pixels
          path: app/build/outputs/roborazzi/*.png
      - name: Assemble release APK
        run: bash gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify distributed APK stays HTTPS-only and test-hook-free
        run: |
          AAPT=$(ls "$ANDROID_HOME/build-tools/"*/aapt | head -1)
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if "$AAPT" list -a "$APK" | grep -q "nd_debug_network"; then
            echo "::error::cleartext mock config leaked into the distributed APK"; exit 1
          fi
          if "$AAPT" list -a "$APK" | grep -q "nd_test_hook\|ND_TEST_HOOK=true"; then
            echo "::error::test hook leaked into the distributed APK"; exit 1
          fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -i "cleartext" || echo "(no cleartext attribute - default strict)"
          echo "OK: distributed APK is HTTPS-only and hook-free"
      - name: Sign APK (persistent key)
        env:
          ND_KEYSTORE_BASE64: ${{ secrets.ND_KEYSTORE_BASE64 }}
          ND_KEYSTORE_PASSWORD: ${{ secrets.ND_KEYSTORE_PASSWORD }}
          ND_KEY_ALIAS: ${{ secrets.ND_KEY_ALIAS }}
          ND_KEY_PASSWORD: ${{ secrets.ND_KEY_PASSWORD }}
        run: |
          echo "$ND_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nd.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "signing NeuralDimension-${VERSION}.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/nd.keystore" --ks-pass "pass:$ND_KEYSTORE_PASSWORD" --ks-key-alias "$ND_KEY_ALIAS" --key-pass "pass:$ND_KEY_PASSWORD" --out "app/build/outputs/apk/release/NeuralDimension-${VERSION}.apk" app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/nd.keystore"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuraldimension-apk
          path: app/build/outputs/apk/release/NeuralDimension-*.apk

  byte-equality:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: neuraldimension-apk
          path: apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install on API 34 emulator and assert byte equality
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          # One line invoking a checked-in bash file: the runner splits multi-line
          # scripts into separate sh -c calls with no cross-line state.
          script: bash tools/verify_byte_equality.sh
