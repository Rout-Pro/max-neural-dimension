name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run JVM unit tests
        run: bash gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble release APK
        run: bash gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify distributed APK stays HTTPS-only and test-hook-free
        run: |
          AAPT=$(ls "$ANDROID_HOME/build-tools/"*/aapt | head -1)
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          if "$AAPT" list -a "$APK" | grep -q "nd_debug_network"; then
            echo "::error::cleartext mock config leaked into the distributed APK"; exit 1
          fi
          if "$AAPT" list -a "$APK" | grep -q "nd_test_hook\|ND_TEST_HOOK=true"; then
            echo "::error::test hook leaked into the distributed APK"; exit 1
          fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -i "cleartext" || echo "(no cleartext attribute - default strict)"
          echo "OK: distributed APK is HTTPS-only and hook-free"
      - name: Sign APK (persistent key)
        env:
          ND_KEYSTORE_BASE64: ${{ secrets.ND_KEYSTORE_BASE64 }}
          ND_KEYSTORE_PASSWORD: ${{ secrets.ND_KEYSTORE_PASSWORD }}
          ND_KEY_ALIAS: ${{ secrets.ND_KEY_ALIAS }}
          ND_KEY_PASSWORD: ${{ secrets.ND_KEY_PASSWORD }}
        run: |
          echo "$ND_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nd.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/nd.keystore" --ks-pass "pass:$ND_KEYSTORE_PASSWORD" --ks-key-alias "$ND_KEY_ALIAS" --key-pass "pass:$ND_KEY_PASSWORD" --out app/build/outputs/apk/release/NeuralDimension-2.0.apk app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/nd.keystore"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuraldimension-apk
          path: app/build/outputs/apk/release/NeuralDimension-2.0.apk
